name: Tarkov Live News Ingestion

# External scheduler for /api/cron/tarkov-live. Vercel Hobby only fires project
# crons about once per day; this workflow keeps official Steam/website detection
# near the five-minute target without a second ingestion pipeline.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarkov-live-news-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Invoke production cron
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_URL: https://tarkovdex.dev/api/cron/tarkov-live

    steps:
      - name: Call protected ingestion endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "CRON_SECRET GitHub Actions secret is not configured."
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "$CRON_URL")"

          echo "HTTP status: ${status}"

          if command -v jq >/dev/null 2>&1; then
            jq -r '
              "ok=\(.ok // false)",
              "locked=\(.locked // false)",
              "error=\(.error // "none")",
              "sources=\((.sources // []) | length)",
              "newPosts=\((.sources // []) | map(.newPosts // 0) | add // 0)",
              "events=\((.sources // []) | map(.eventsUpserted // 0) | add // 0)"
            ' "$body" || echo "response_parse=unparsed"
          else
            echo "response_bytes=$(wc -c < "$body" | tr -d ' ')"
          fi

          # 200 = completed. 409 = another run holds the DB lock (safe no-op;
          # Vercel daily fallback or an overlapping dispatch may collide).
          if [[ "$status" == "200" || "$status" == "409" ]]; then
            exit 0
          fi

          echo "Ingestion endpoint returned a non-success status."
          exit 1
