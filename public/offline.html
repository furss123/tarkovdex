<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#17181b" />
    <title>TarkovDex — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #17181b;
        --fg: #e8e8ea;
        --muted: #9a9aa0;
        --border: #2c2d32;
        --accent: #e2a438;
        --surface: #1e1f24;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: Pretendard, 'Noto Sans SC', system-ui, sans-serif;
        font-weight: 400;
        background: var(--bg);
        color: var(--fg);
        padding: max(1.5rem, env(safe-area-inset-top))
          max(1.25rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.25rem, env(safe-area-inset-left));
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 500;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 1rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 1.5rem 0;
      }
      button,
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        min-width: 44px;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--fg);
        text-decoration: none;
        font: inherit;
        cursor: pointer;
      }
      button.primary,
      a.button.primary {
        background: var(--accent);
        color: #17181b;
        border-color: var(--accent);
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent);
        outline-offset: 2px;
      }
      ul {
        margin: 0;
        padding-left: 1.25rem;
        color: var(--muted);
      }
      li {
        margin-bottom: 0.35rem;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 1rem;
        background: var(--surface);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">오프라인</h1>
      <p id="lead">
        이 페이지는 아직 오프라인에 저장되지 않았습니다. 인터넷에 연결한 뒤 다시
        시도하십시오.
      </p>
      <div class="actions">
        <button type="button" class="primary" id="retry">다시 시도</button>
        <a class="button" id="home" href="/ko">홈으로</a>
      </div>
      <div class="card">
        <p id="availTitle" style="color: var(--fg); margin-bottom: 0.5rem">
          오프라인에서 사용 가능한 기능
        </p>
        <ul id="features"></ul>
        <p id="note" style="margin-top: 1rem; margin-bottom: 0">
          저장된 로컬 진행 상태는 이 기기에서만 유지됩니다. 가격·뉴스·패치는
          네트워크가 필요합니다.
        </p>
      </div>
    </main>
    <script>
      (function () {
        var catalog = {
          ko: {
            title: '오프라인',
            lead: '이 페이지는 아직 오프라인에 저장되지 않았습니다. 인터넷에 연결한 뒤 다시 시도하십시오.',
            retry: '다시 시도',
            home: '홈으로',
            availTitle: '오프라인에서 사용 가능한 기능',
            note: '저장된 로컬 진행 상태는 이 기기에서만 유지됩니다. 가격·뉴스·패치는 네트워크가 필요합니다.',
            features: [
              '퀘스트 추적기 진행 상태',
              '레이드 준비표',
              '관심 목록(마지막 관측)',
              '제작·예산 설정',
              '최근 검색 기록',
              '로컬 데이터 관리',
            ],
          },
          en: {
            title: 'Offline',
            lead: 'This page has not been saved for offline use yet. Connect to the internet and try again.',
            retry: 'Retry',
            home: 'Home',
            availTitle: 'Available offline (if already visited)',
            note: 'Saved local progress stays on this device. Prices, news, and patches need a network.',
            features: [
              'Quest tracker progress',
              'Raid prep plans',
              'Watchlist (last observations)',
              'Craft and budget settings',
              'Recent searches',
              'Local data management',
            ],
          },
          zh: {
            title: '离线',
            lead: '此页面尚未保存为离线可用。请连接网络后重试。',
            retry: '重试',
            home: '首页',
            availTitle: '离线可用功能（需曾访问）',
            note: '本地进度仅保存在本设备。价格、新闻与补丁需要网络。',
            features: [
              '任务进度',
              '突袭准备表',
              '关注列表（上次观测）',
              '制作与预算设置',
              '最近搜索',
              '本地数据管理',
            ],
          },
        };

        var locale = 'ko';
        try {
          var path = location.pathname || '';
          var m = path.match(/^\/(ko|en|zh)(?:\/|$)/);
          if (m) locale = m[1];
          else {
            var ref = document.referrer || '';
            var rm = ref.match(/\/(ko|en|zh)(?:\/|$)/);
            if (rm) locale = rm[1];
            var q = new URLSearchParams(location.search).get('locale');
            if (q === 'en' || q === 'zh' || q === 'ko') locale = q;
          }
        } catch (e) {}

        var copy = catalog[locale] || catalog.ko;
        document.documentElement.lang = locale;
        document.getElementById('title').textContent = copy.title;
        document.getElementById('lead').textContent = copy.lead;
        document.getElementById('retry').textContent = copy.retry;
        document.getElementById('home').textContent = copy.home;
        document.getElementById('home').setAttribute('href', '/' + locale);
        document.getElementById('availTitle').textContent = copy.availTitle;
        document.getElementById('note').textContent = copy.note;
        var list = document.getElementById('features');
        list.innerHTML = '';
        copy.features.forEach(function (text) {
          var li = document.createElement('li');
          li.textContent = text;
          list.appendChild(li);
        });

        document.getElementById('retry').addEventListener('click', function () {
          location.reload();
        });
      })();
    </script>
  </body>
</html>
